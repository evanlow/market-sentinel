name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check . --output-format=concise | tee ruff-report.txt
      - name: Upload Ruff report
        if: steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ matrix.python-version }}
          path: ruff-report.txt
      - run: pytest --cov=market_sentinel --cov-report=term-missing
      - name: Fail when Ruff found violations
        if: always() && steps.ruff.outcome == 'failure'
        run: exit 1
